services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio"]
      interval: 3s
      timeout: 3s
      retries: 20

  platform:
    build: .
    command: node fake-platform/server.js
    environment:
      FAKE_PLATFORM_PORT: 4010
      STUDIO_WEBHOOK_URL: http://api:4000/webhooks/platform
      PLATFORM_WEBHOOK_SECRET: ${PLATFORM_WEBHOOK_SECRET:-webhook-secret}
      FAKE_DELIVERY_DELAY_MS: 400
    ports:
      - "4010:4010"

  api:
    build: .
    command: node src/server.js
    environment:
      PORT: 4000
      DATABASE_URL: postgres://studio:studio@db:5432/studio
      PLATFORM_BASE_URL: http://platform:4010
      PLATFORM_WEBHOOK_SECRET: ${PLATFORM_WEBHOOK_SECRET:-webhook-secret}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-local-dev-key-change-me}
      MEDIA_DIR: /app/out/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - media:/app/out/media

  worker:
    build: .
    command: node src/worker.js
    environment:
      DATABASE_URL: postgres://studio:studio@db:5432/studio
      PLATFORM_BASE_URL: http://platform:4010
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-local-dev-key-change-me}
      MEDIA_DIR: /app/out/media
      WORKER_POLL_MS: 500
      JOB_LEASE_SECONDS: 10
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/out/media

volumes:
  db-data:
  media:
